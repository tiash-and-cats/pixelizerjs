<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" type="text/css" href="style.css">
  <meta charset="utf-8">
</head>
<body>

<main>
  <canvas id="canvas" width="600" height="400"></canvas>
  <p>This demo was made using Babylon.js and pixelizer.js. Try dragging inside the canvas!</p>
  <p><i>Might be a bit slow, as it imports quite literally ALL of Babylon.js, even the unused parts, from the CDN! This demo would be much more performant with a bundler like Vite.</i></p>
  <p><a href="https://github.com/tiash-and-cats/pixelizerjs/tree/master/demos/babylon">See the source code!</a></p>
</main>

<script type="importmap">
  {
    "imports": {
      "@babylonjs/core": "https://cdn.jsdelivr.net/npm/@babylonjs/core@9.35.0/index.js",
      "@babylonjs/core/": "https://cdn.jsdelivr.net/npm/@babylonjs/core@9.35.0/",
      "@babylonjs/loaders": "https://cdn.jsdelivr.net/npm/@babylonjs/loaders@9.35.0/index.js",
      "@babylonjs/loaders/": "https://cdn.jsdelivr.net/npm/@babylonjs/loaders@9.35.0/"
    }
  }
</script>

<script src="index.js" type="module"></script>

</body>
</html>
